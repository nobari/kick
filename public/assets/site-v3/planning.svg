<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="Illustrative planning example with sample data"><rect width="640" height="430" fill="#f1f4f9"/><rect x="40" y="35" width="560" height="360" rx="20" fill="white"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172137">Room for the right work</text><text x="70" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#505d70">Open tasks / self-declared weekly limit</text><text x="70" y="160" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#172137">Teammate A</text><rect x="245" y="143" width="255" height="22" rx="12" fill="#eef3fb"/><rect x="245" y="143" width="153" height="22" rx="12" fill="#2448ad"/><text x="523" y="160" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#172137">3 / 5</text><text x="70" y="222" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#172137">Teammate B</text><rect x="245" y="205" width="255" height="22" rx="12" fill="#eef3fb"/><rect x="245" y="205" width="255" height="22" rx="12" fill="#dd6b36"/><text x="523" y="222" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#172137">5 / 4</text><text x="70" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#172137">Teammate C</text><text x="245" y="284" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#505d70">Capacity not set</text><rect x="70" y="320" width="500" height="45" rx="12" fill="#fff0e6"/><text x="90" y="349" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#9f3d15">A prompt to reprioritize, not a performance score.</text></svg>
