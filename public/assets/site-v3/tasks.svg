<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="Illustrative tasks example with sample data"><rect width="640" height="430" fill="#f1f4f9"/><rect x="40" y="35" width="560" height="360" rx="20" fill="white"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172137">Channel to-dos</text><text x="70" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#505d70">One owner. One clear next step.</text><rect x="70" y="135" width="500" height="66" rx="12" fill="#eef3fb"/><rect x="87" y="155" width="24" height="24" rx="5" fill="#d9efdf"/><path d="m90 166 6 6 12-15" stroke="#287052" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="130" y="164" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172137">Review the release notes</text><text x="130" y="188" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#505d70">Done · Product team</text><rect x="70" y="216" width="500" height="66" rx="12" fill="#fff0e6"/><rect x="87" y="236" width="24" height="24" rx="5" fill="white"/><text x="130" y="245" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172137">Prepare the team demo</text><text x="130" y="269" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#505d70">Open · Demo owner · Due Friday</text><text x="70" y="332" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2448ad">Personal list? Keep it separate.</text><text x="70" y="360" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#505d70">Your private tasks stay out of team reports.</text></svg>
