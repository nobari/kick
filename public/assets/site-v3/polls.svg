<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="Illustrative polls example with sample data"><rect width="640" height="430" fill="#f1f4f9"/><rect x="40" y="35" width="560" height="360" rx="20" fill="white"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172137">Which day for the demo?</text><text x="70" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#505d70">A channel poll · sample results</text><text x="70" y="160" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172137">Tuesday</text><rect x="70" y="175" width="500" height="28" rx="12" fill="#eef3fb"/><rect x="70" y="175" width="190" height="28" rx="12" fill="#9eb6ed"/><text x="545" y="160" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#172137">3</text><text x="70" y="245" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172137">Thursday</text><rect x="70" y="260" width="500" height="28" rx="12" fill="#eef3fb"/><rect x="70" y="260" width="315" height="28" rx="12" fill="#2448ad"/><text x="545" y="245" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#172137">5</text><text x="70" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#172137">One vote each. Change it before closing.</text><text x="70" y="370" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#505d70">Votes are not anonymous.</text></svg>
