<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="Illustrative people example with sample data"><rect width="640" height="430" fill="#f1f4f9"/><rect x="40" y="35" width="560" height="360" rx="20" fill="white"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172137">A better one-on-one</text><text x="70" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#505d70">Shared only with your conversation partner</text><rect x="70" y="137" width="500" height="89" rx="12" fill="#eef3fb"/><text x="90" y="168" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2448ad">On the agenda</text><text x="90" y="200" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#172137">What support would help next week?</text><text x="70" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172137">A follow-up with an owner</text><rect x="70" y="290" width="500" height="52" rx="12" fill="#e9f2ec"/><path d="m90 315 6 6 12-15" stroke="#287052" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="125" y="323" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#172137">Make time for a pairing session</text><text x="70" y="372" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#505d70">Private agendas never enter team reports.</text></svg>
